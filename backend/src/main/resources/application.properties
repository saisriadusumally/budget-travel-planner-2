# ---- Database ----
# Default: embedded H2 file database (no install needed, data saved in backend/data/).
# To use MySQL, set these environment variables before starting:
#   DB_URL=jdbc:mysql://<host>:3306/budget_travel?createDatabaseIfNotExist=true
#   DB_USER=<user>   DB_PASSWORD=<password>
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/budgettravel;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---- Server ----
server.port=${PORT:8080}
server.error.include-message=always

# ---- Auth ----
# Set JWT_SECRET (32+ chars) so logins survive restarts; if empty a random key is used.
app.jwt.secret=${JWT_SECRET:}
app.jwt.hours=8
# Set COOKIE_SECURE=true when serving over HTTPS.
app.cookie.secure=${COOKIE_SECURE:false}
